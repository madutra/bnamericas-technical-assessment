# Everything in containers: `docker compose up --build`, then open http://localhost:4000.
# Production-like: 3 backend instances behind nginx: `docker compose up --build --scale backend=3`.
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: project_editor
      MYSQL_USER: editor
      MYSQL_PASSWORD: editor
    ports:
      - "3307:3306" # 3307 on the host, so it does not clash with a local MySQL on 3306
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 30

  upstream:
    build:
      context: .
      dockerfile: docker/upstream.Dockerfile
    environment:
      # Set both to 0 to turn the flakiness off: UPSTREAM_SLOW_RATE=0 UPSTREAM_TIMEOUT_RATE=0 docker compose up
      UPSTREAM_SLOW_RATE: ${UPSTREAM_SLOW_RATE:-0.1}
      UPSTREAM_TIMEOUT_RATE: ${UPSTREAM_TIMEOUT_RATE:-0.1}
    # No ports published: like the real upstream, only the backend talks to it.

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      EDITOR_UPSTREAM_URL: http://upstream:8081
      EDITOR_UPSTREAM_API_KEY: local-dev-key
      EDITOR_DATABASE_URL: mysql+aiomysql://editor:editor@mysql:3306/project_editor
      # EDITOR_INSTANCE_ID defaults to the container's hostname, so save_log shows which instance saved.
    depends_on:
      mysql:
        condition: service_healthy
      upstream:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "4000:80"
    depends_on:
      - backend

volumes:
  mysql-data:
