[project]
name = "records-api"
version = "1.0.0"
description = "Fictional upstream records API for the CMS2 hiring challenge"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
upstream = "records_api.main:run"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["records_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
