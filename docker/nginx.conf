server {
    listen 80;
    root /usr/share/nginx/html;

    # The browser only talks to this origin; the backend is reachable only inside the compose network.
    # With `--scale backend=3`, Docker's DNS returns every instance and nginx spreads requests across them.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # A save can take several seconds (slow upstream GETs, 504 retries, waiting for the lock).
        proxy_read_timeout 60s;
    }

    # Client-side routes such as /projects/P-1001.
    location / {
        try_files $uri /index.html;
    }
}
